# ===== Cấu hình khi chạy trên Google Cloud Run (SPRING_PROFILES_ACTIVE=prod) =====
server.port=${PORT:8080}

# Kết nối Cloud SQL (PostgreSQL) qua Cloud SQL Java Connector, không cần mở IP công khai.
# DB_INSTANCE có dạng  PROJECT_ID:REGION:INSTANCE  (ví dụ my-project:asia-southeast1:shop-db)
spring.datasource.url=jdbc:postgresql:///${DB_NAME:shopdb}?cloudSqlInstance=${DB_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Mật khẩu admin lấy từ Secret Manager, không dùng mật khẩu mặc định trên internet
app.admin-password=${ADMIN_PASSWORD}
# Không hiện tài khoản admin trên trang đăng nhập công khai
app.show-admin-demo=false

# Ảnh sản phẩm lưu trên Google Cloud Storage (GcsImageStorage)
app.gcs-bucket=${GCS_BUCKET:}
