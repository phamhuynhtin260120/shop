<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Có lỗi xảy ra | Pattern Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container error-page">
    <p class="eyebrow" th:text="'Lỗi ' + ${status}">Lỗi 404</p>
    <h1 th:if="${status == 404}">Không tìm thấy trang hoặc sản phẩm</h1>
    <h1 th:unless="${status == 404}">Có lỗi xảy ra</h1>
    <p class="muted" th:text="${message}">Chi tiết lỗi</p>
    <a class="btn btn-dark" th:href="@{/}">Về trang chủ</a>
</main>
</body>
</html>
