spring.application.name=shop

# Kết nối PostgreSQL chạy trong Docker (xem compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb
spring.datasource.username=shop
spring.datasource.password=shop123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hiển thị thông báo lỗi trên trang error.html
server.error.include-message=always

# Mật khẩu admin tạo lần đầu và việc hiện tài khoản admin trên trang đăng nhập (máy cá nhân)
app.admin-password=admin123
app.show-admin-demo=true
