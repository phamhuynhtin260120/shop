services:
  postgres:                          # tên service, cũng là "tên máy" trong mạng Docker
    image: postgres:16               # PostgreSQL bản 16
    container_name: shop-postgres
    environment:                     # image tự tạo DB và user ở lần chạy đầu tiên
      POSTGRES_DB: shopdb
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop123
    ports:
      - "5432:5432"                  # cổng máy Mac : cổng trong container
    volumes:
      - pgdata:/var/lib/postgresql/data   # dữ liệu lưu ra volume, tắt container không mất

  pgadmin:                           # giao diện web xem dữ liệu: http://localhost:5050
    image: dpage/pgadmin4:8
    container_name: shop-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shop.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:                               # ứng dụng Spring Boot, chạy bằng JDK + Maven trong container
    image: maven:3.9-eclipse-temurin-21
    container_name: shop-app
    working_dir: /app
    command: mvn spring-boot:run
    ports:
      - "8081:8080"                  # mở http://localhost:8081 (cổng 8080 trên Mac đang bị node chiếm)
    volumes:
      - ./:/app                      # mã nguồn trên máy được "gắn" vào container
      - m2:/root/.m2                 # lưu thư viện Maven, lần sau khỏi tải lại
    environment:
      # Trong mạng Docker, database có tên máy là "postgres" (không phải localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopdb
      # Đọc HTML/CSS trực tiếp từ thư mục nguồn: sửa giao diện chỉ cần F5 trình duyệt
      SPRING_THYMELEAF_PREFIX: file:/app/src/main/resources/templates/
      SPRING_THYMELEAF_CACHE: "false"
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/src/main/resources/static/
    depends_on:
      - postgres

volumes:
  pgdata:
  m2:
